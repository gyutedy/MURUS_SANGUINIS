name: MURUS — PREVIEW 2 (SF_13_POLITURA, postprod glow + sous-titres + lut + fade)

# PREVIEW 2 = une REVIEW, pas un rapport (voir TRACKING/PREVIEW2_SPEC.md).
# Même châssis que la preview 1 : lecteur vidéo en haut, frame du clip, et QUATRE
# panneaux à curseurs à droite (glow vidéo, sous-titres, lut, fade).
# Elle signe codex_postprod.json et rien d'autre.
#
# ARCHITECTURE (consigne opérateur) :
#   - aucune exécution locale : tout sur GitHub Actions (déclenchement futur Telegram/Discord) ;
#   - UN JOB PAR CLIP (matrice) : frame isolée, un clip raté n'annule rien ;
#   - les clips publiés par la preview 1 (Pages) sont réutilisés ; yt-dlp en secours.
#
# OPTION A (choisie par l'opérateur) : l'aperçu navigateur est approximatif (CSS),
# et le job exact_frame applique la VRAIE chaîne ffmpeg (glow/modal_glow.py) sur la frame.
#
# Portes : GL1 (mode scene|subject, sigma 4..30, opacité 0..0.6), GL2 (bande sous-titres
# jamais floutée), PP2 (ordre gravé glow -> caption -> lut -> fade), PP1 (signature).

on:
  workflow_dispatch:
    inputs:
      vod_url:
        description: 'VOD source (si le clip nest pas deja publie par la preview 1)'
        required: false
        default: 'https://www.twitch.tv/videos/2909800627'
        type: string
      publish_pages:
        description: 'Publier sur GitHub Pages (oui|non)'
        required: false
        default: 'oui'
        type: string

concurrency:
  group: murus-preview2-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      assets: ${{ steps.list.outputs.assets }}
      count: ${{ steps.list.outputs.count }}
      found: ${{ steps.list.outputs.found }}
    steps:
      - uses: actions/checkout@v4

      - name: Lister les clips du pack exporte
        id: list
        run: |
          if [ ! -f REVIEW/pack_stage.json ]; then
            echo "found=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python - << 'PYEOF'
          import json, os
          from pathlib import Path

          pack = json.loads(Path("REVIEW/pack_stage.json").read_text(encoding="utf-8"))
          assets = pack.get("assets") or []
          plan = [{"index": i,
                   "id": (a.get("id") or ("clip%02d" % (i + 1))),
                   "start": float(a.get("start_sec") or 0),
                   "end": float(a.get("end_sec") or 0),
                   "text": (a.get("overlay_title") or a.get("caption") or "")}
                  for i, a in enumerate(assets)]

          out = Path(os.environ["GITHUB_OUTPUT"])
          with out.open("a", encoding="utf-8") as f:
              f.write("assets=" + json.dumps(plan) + "\n")
              f.write("count=%d\n" % len(plan))
              f.write("found=1\n")
          print("plan : %d clips" % len(plan))
          PYEOF

  frame:
    needs: plan
    if: fromJSON(needs.plan.outputs.found) == 1
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        clip: ${{ fromJson(needs.plan.outputs.assets) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer ffmpeg + yt-dlp
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg
          python -m pip install --quiet --upgrade yt-dlp

      - name: Prendre le clip publie par la preview 1 (yt-dlp en secours)
        env:
          ID: ${{ matrix.clip.id }}
          IDX: ${{ matrix.clip.index }}
          INPUT_VOD: ${{ inputs.vod_url }}
        run: |
          mkdir -p /tmp/work/clips /tmp/work/frames
          OUT="/tmp/work/clips/pur_${ID}.mp4"
          curl -fsSL --max-time 300 "https://gyutedy.github.io/MURUS_SANGUINIS/clips/pur_${ID}.mp4" -o "$OUT" || true
          if [ ! -s "$OUT" ] || [ "$(stat -c%s "$OUT")" -lt 1000000 ]; then
            echo "clip absent des Pages : recuperation par yt-dlp"
            python FR_B_CREATION/tools/recuperer_clip.py --pack REVIEW/pack_stage.json \
              --index "$IDX" --out-dir /tmp/work/clips --no-frame --vod "$INPUT_VOD"
          fi
          ls -la /tmp/work/clips

      - name: Extraire la frame de reference (40 pourcent du clip)
        env:
          ID: ${{ matrix.clip.id }}
        run: |
          CLIP="/tmp/work/clips/pur_${ID}.mp4"
          DUR=$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 "$CLIP")
          AT=$(python -c "print(max(0.2, float('$DUR') * 0.4))")
          ffmpeg -y -v error -ss "$AT" -i "$CLIP" -frames:v 1 "/tmp/work/frames/frame_${ID}.png"
          ls -la /tmp/work/frames

      - name: Publier clip + frame (un artefact par clip)
        uses: actions/upload-artifact@v4
        with:
          name: p2-${{ matrix.clip.id }}
          path: /tmp/work
          if-no-files-found: error
          retention-days: 14

  assemble:
    needs: [plan, frame]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Telecharger clips + frames
        uses: actions/download-artifact@v4
        with:
          path: /tmp/work
          pattern: p2-*
          merge-multiple: true

      - name: Verifier le compte (anti-remplissage - on annonce ce qui est la)
        run: |
          N=$(ls /tmp/work/frames/frame_*.png 2>/dev/null | wc -l)
          echo "frames presentes : $N"
          if [ "$N" -eq 0 ]; then
            echo "::error::aucune frame : rien a reviewer"
            exit 1
          fi
          ls -la /tmp/work/clips | head

      - name: Construire le manifeste de la review
        run: |
          python - << 'PYEOF'
          import json, os, shutil
          from pathlib import Path

          pack = json.loads(Path("REVIEW/pack_stage.json").read_text(encoding="utf-8"))
          app = Path("FR_B_CREATION/SF_13_POLITURA/PREVIEW2")
          pub = app / "public"
          (pub / "clips").mkdir(parents=True, exist_ok=True)
          (pub / "frames").mkdir(parents=True, exist_ok=True)

          clips = []
          for a in pack.get("assets") or []:
              cid = a.get("id")
              src_clip = Path("/tmp/work/clips/pur_%s.mp4" % cid)
              src_frame = Path("/tmp/work/frames/frame_%s.png" % cid)
              if not src_frame.exists():
                  print("frame absente, clip ignore :", cid)
                  continue
              if src_clip.exists():
                  shutil.copy(src_clip, pub / "clips" / ("pur_%s.mp4" % cid))
              shutil.copy(src_frame, pub / "frames" / ("frame_%s.png" % cid))
              clips.append({
                  "id": cid,
                  "file": "./clips/pur_%s.mp4" % cid,
                  "frame": "./frames/frame_%s.png" % cid,
                  "text": a.get("overlay_title") or a.get("caption") or "",
                  "caption_start": 0.6,
                  "exact_frame": ("./exact/frame_%s.png" % cid) if Path("REVIEW/preview2/exact/frame_%s.png" % cid).exists() else "",
              })

          prof = json.loads(Path("FR_B_CREATION/SF_13_POLITURA/CODEBASE/lut/profiles/atom_ic_profiles.json").read_text(encoding="utf-8"))
          man = {
              "pack_token": pack.get("pack_token"),
              "clips": clips,
              "lut_profiles": list((prof.get("profiles") or {}).keys()),
              "lut_default": prof.get("default_profile"),
              "note": "manifeste ecrit par murus_preview_2.yml (assemble)",
          }
          (pub / "manifest.json").write_text(json.dumps(man, indent=2, ensure_ascii=False), encoding="utf-8")
          print("manifeste :", len(clips), "clips |", len(man["lut_profiles"]), "profils LUT")
          PYEOF

      - name: Construire la review (Vite)
        working-directory: FR_B_CREATION/SF_13_POLITURA/PREVIEW2
        run: |
          npm install --no-audit --no-fund --loglevel=error
          npm run build

      - name: Rester sous la limite de taille de Pages
        working-directory: FR_B_CREATION/SF_13_POLITURA/PREVIEW2
        run: |
          du -sh dist || true
          find dist -type f -size +50M -print -delete || true

      - name: Publier la review (artefact telechargeable)
        uses: actions/upload-artifact@v4
        with:
          name: preview-2-postprod
          path: FR_B_CREATION/SF_13_POLITURA/PREVIEW2/dist
          if-no-files-found: error
          retention-days: 14

      - name: Publier sur GitHub Pages (sous-dossier preview2)
        if: inputs.publish_pages == 'oui'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: FR_B_CREATION/SF_13_POLITURA/PREVIEW2/dist
          destination_dir: preview2
          keep_files: true

  exact_frame:
    needs: [assemble]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer ffmpeg
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg

      - uses: actions/download-artifact@v4
        with:
          path: /tmp/work
          pattern: p2-*
          merge-multiple: true

      - name: Rendre la frame avec la VRAIE chaine ffmpeg (option A)
        run: |
          mkdir -p REVIEW/preview2/exact
          python - << 'PYEOF'
          import json, subprocess, sys
          from pathlib import Path

          codex_path = Path("REVIEW/codex_postprod.json")
          if codex_path.is_file():
              codex = json.loads(codex_path.read_text(encoding="utf-8"))
              glow = codex.get("glow") or {}
              src = "codex signe"
          else:
              glow = {"mode": "scene", "sigma": 14, "opacity": 0.35, "enabled": True}
              src = "defauts (codex non signe) : apercu seulement"
          print("parametres exact_frame :", src, glow)

          frames = sorted(Path("/tmp/work/frames").glob("frame_*.png"))
          if not frames:
              print("::error::aucune frame a rendre")
              sys.exit(1)
          for fr in frames:
              out = Path("REVIEW/preview2/exact") / fr.name
              cmd = [sys.executable, "FR_B_CREATION/SF_11_LUMEN/CODEBASE/preview_glow.py",
                     "--in", str(fr), "--out", str(out),
                     "--mode", str(glow.get("mode", "scene")),
                     "--sigma", str(glow.get("sigma", 14)),
                     "--opacity", str(glow.get("opacity", 0.35))]
              r = subprocess.run(cmd, capture_output=True, text=True)
              print(fr.name, "->", "OK" if r.returncode == 0 else "ECHEC")
              if r.returncode != 0:
                  print((r.stdout or "")[-800:])
                  print((r.stderr or "")[-800:])
          PYEOF

      - name: Republier la frame exacte dans la review
        if: inputs.publish_pages == 'oui'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: REVIEW/preview2/exact
          destination_dir: preview2/exact
          keep_files: true

  codex_trace:
    needs: [assemble]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Valider le codex signe et ecrire sa provenance (sidecar E-5)
        run: |
          python - << 'PYEOF'
          import hashlib, json, subprocess, sys
          from pathlib import Path

          cx = Path("REVIEW/codex_postprod.json")
          if not cx.is_file():
              print("codex_postprod.json absent : rien a tracer (PP1 tient : aucun rendu)")
              print("on apprend a l operateur ou signer : la review /preview2/ exporte ce fichier")
              sys.exit(0)

          raw = cx.read_text(encoding="utf-8")
          r = subprocess.run([sys.executable, "FR_B_CREATION/tools/codex.py", "check", str(cx), "--kind", "postprod"],
                             capture_output=True, text=True)
          if r.returncode != 0:
              print("::error::codex_postprod.json refuse par le validateur")
              print((r.stdout or "")[-2000:])
              print((r.stderr or "")[-2000:])
              sys.exit(1)

          pack = json.loads(Path("REVIEW/pack_stage.json").read_text(encoding="utf-8"))
          prov = {
              "declared_by": "operateur",
              "source": "review preview 2 (SF_13_POLITURA/PREVIEW2) -> Export codex_postprod.json",
              "pack_token": pack.get("pack_token"),
              "pack_token_coherent": pack.get("pack_token") == json.loads(raw).get("pack_token"),
              "sha256": hashlib.sha256(raw.encode("utf-8")).hexdigest(),
              "validated_by_magos": json.loads(raw).get("validated_by_magos"),
              "note": "Le codex est la verite signee ; la provenance vit ici (ERRATA E-5).",
          }
          Path("REVIEW/codex_postprod.provenance.json").write_text(json.dumps(prov, indent=2, ensure_ascii=False) + chr(10), encoding="utf-8")
          print("provenance ecrite | sha256:", prov["sha256"][:16], "| pack coherent:", prov["pack_token_coherent"])
          PYEOF

      - name: Commiter la provenance (pas de retard local/GitHub)
        run: |
          git config user.name "murus-bot"
          git config user.email "murus-bot@users.noreply.github.com"
          git add REVIEW/codex_postprod.provenance.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "provenance inchangee"
          else
            git commit -m "[CI] provenance du codex postprod (sha256 relu)"
            git push
          fi

  ui_check:
    needs: [assemble]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: preview-2-postprod
          path: /tmp/site

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Servir le site construit
        working-directory: /tmp/site
        run: |
          npx --yes http-server . -p 8098 --silent &
          sleep 3
          curl -s -o /dev/null -w "site HTTP %{http_code}\n" http://127.0.0.1:8098/

      - name: Installer Chromium
        run: |
          npm init -y > /dev/null 2>&1
          npm i --no-audit --no-fund puppeteer@23 > /dev/null 2>&1

      - name: Verifier les quatre panneaux dans un vrai navigateur
        env:
          P2_URL: http://127.0.0.1:8098/
        run: node tests/ui_preview2.mjs

      - name: Publier la capture d ecran
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preview-2-screenshot
          path: |
            preview-2.png
            preview-2.json
          if-no-files-found: warn
          retention-days: 14
