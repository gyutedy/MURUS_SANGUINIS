# MURUS — TELEGRAM (une commande = un run)
#
# Relais : Cloudflare Worker (webhook) -> ce workflow -> nuntius.py
# Le Worker a deja verifie le secret Telegram et la liste blanche des chats.
# Ici on execute, on journalise (ARCHIVUM/telegram/journal.jsonl) et on repond.
#
# Inputs :
#   cmd        /etat | /clips | /rapport | /rendu | /stop | /publier
#   arguments  "A01" pour /rapport, l'id du run pour /stop, la phrase pour /publier
#   update_id  identifiant Telegram : un rejeu ne relance JAMAIS deux fois
#   chat_id    chat Telegram demandeur (verifie encore ici, ceinture et bretelles)

name: murus-telegram

on:
  # Un declencheur push est necessaire pour que GitHub indexe le workflow : sans lui,
  # un workflow_dispatch sur un fichier neuf repond 404. Le job ne fait rien sur push.
  push:
    paths:
      - ".github/workflows/murus_telegram.yml"
  workflow_dispatch:
    inputs:
      cmd:
        description: "Commande (/etat, /clips, /rapport, /rendu, /stop)"
        required: true
        type: string
      arguments:
        description: "Arguments eventuels"
        required: false
        default: ""
        type: string
      update_id:
        description: "Identifiant Telegram (anti-rejeu)"
        required: false
        default: ""
        type: string
      chat_id:
        description: "Chat Telegram demandeur"
        required: false
        default: ""
        type: string
      fichier_id:
        description: "file_id Telegram (photo envoyee avec /watermark)"
        required: false
        default: ""
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: murus-telegram
  cancel-in-progress: false

jobs:
  commande:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verifier que le demandeur est bien l'operateur
        env:
          CHAT_DEMANDE: ${{ inputs.chat_id }}
          OPERATEUR: ${{ secrets.TELEGRAM_OPERATEUR_ID }}
        run: |
          if [ -n "$OPERATEUR" ] && [ "$CHAT_DEMANDE" != "$OPERATEUR" ]; then
            echo "::error::chat non autorise ($CHAT_DEMANDE) : commande refusee"
            exit 1
          fi
          echo "demandeur autorise"

      - name: Executer la commande et repondre
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_OPERATEUR_ID: ${{ secrets.TELEGRAM_OPERATEUR_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python FR_A_CERVEAU/SF_09_NUNTIUS/CODEBASE/nuntius.py             --commande "${{ inputs.cmd }}"             --arguments "${{ inputs.arguments }}"             --update-id "${{ inputs.update_id }}"             --chat-id "${{ inputs.chat_id }}"             --fichier-id "${{ inputs.fichier_id }}"

      - name: Enregistrer les actes (journal, verdicts, campagne, directive)
        run: |
          # Un acte qui n'est pas pousse n'existe pas : le runner disparait avec ses
          # fichiers. On pousse donc TOUT ce qu'une commande peut ecrire.
          git config user.name "MURUS NUNTIUS"
          git config user.email "nuntius@murus.local"
          git add ARCHIVUM/telegram/journal.jsonl ARCHIVUM/campagnes/journal.jsonl                   ARCHIVUM/campaign/ REVIEW/campagnes.json REVIEW/verdicts.jsonl 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "aucun acte a enregistrer"
            exit 0
          fi
          git commit -m "telegram: ${{ inputs.cmd }} ${{ inputs.arguments }} (update ${{ inputs.update_id }})" || true
          for essai in 1 2 3; do
            if git push; then echo "actes pousses"; exit 0; fi
            git pull --rebase --autostash || true
            sleep 5
          done
          echo "::warning::actes non pousses (course git) — la trace reste dans le log du run"
