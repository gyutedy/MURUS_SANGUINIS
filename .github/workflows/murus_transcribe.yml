name: MURUS — transcription GPU Modal (SF_05_VOX)

# Pattern pillé : PERTURABO/.github/workflows/perturabo_transcribe.yml [VÉRIFIÉ].
# Déploiement Modal piloté par GitHub Actions — rien ne tourne sur la machine opérateur.
# Secrets requis : MODAL_TOKEN_ID, MODAL_TOKEN_SECRET.

on:
  workflow_dispatch:
    inputs:
      vod_url:
        description: 'URL de la VOD Twitch'
        required: true
        type: string
      nb_clips:
        description: 'Nombre de clips à scorer (cap 15)'
        required: false
        type: string
        default: '15'
      whisper_gpu:
        description: 'Moteur des VM : T4 (GPU, exige un moyen de paiement Modal) ou none (CPU)'
        required: false
        type: choice
        default: 'none'
        options:
          - none
          - T4

jobs:
  transcribe:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg jq
          pip install --upgrade pip
          pip install yt-dlp modal fastapi python-multipart numpy

      - name: Deploy Modal transcription service (F00B_VOX/MODAL -> MODAL/transcribe.py)
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          WHISPER_GPU: ${{ inputs.whisper_gpu }}
        run: |
          # Le service Modal vit dans le dépôt PERTURABO d'origine :
          # MONDES_FORGES/CLIPPING/F00_IRON_SENTINEL/F00B_VOX/MODAL/transcribe.py
          # Il est copié ici : MODAL/transcribe.py (racine du dépôt).
          set +e
          echo "moteur demande : ${WHISPER_GPU:-none} (none = CPU, aucune facturation GPU)"
          modal deploy MODAL/transcribe.py 2>&1 | tee /tmp/modal_deploy.log
          RC=${PIPESTATUS[0]}
          if [ $RC -ne 0 ]; then
            echo "::error::modal deploy failed rc=$RC"
            exit $RC
          fi
          URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.modal\.run' /tmp/modal_deploy.log | head -1)
          if [ -z "$URL" ]; then
            echo "::error::Aucune URL .modal.run trouvée dans la sortie du deploy"
            exit 1
          fi
          echo "MODAL_URL=$URL" >> "$GITHUB_ENV"

      - name: Transcrire en FAN-OUT (8 morceaux = 8 VM Modal en parallele)
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          VOD_URL: ${{ inputs.vod_url }}
          WHISPER_GPU: ${{ inputs.whisper_gpu }}
        run: |
          VODID=$(echo "$VOD_URL" | grep -oE '[0-9]{6,}' | head -1)
          mkdir -p ARCHIVUM/montage/transcripts
          python FR_A_CERVEAU/SF_05_VOX/CODEBASE/transcrire_vod.py \
            --vod "$VOD_URL" \
            --out "ARCHIVUM/montage/transcripts/v${VODID}_transcript.json" \
            --chunks 8 \
            --model small.en \
            --language en \
            --max-minutes 180 \
            --report "ARCHIVUM/montage/transcripts/v${VODID}_transcription_report.json" \
            | tee /tmp/fanout.json
          echo "--- rapport ---"
          cat "ARCHIVUM/montage/transcripts/v${VODID}_transcription_report.json"

      - name: Commit transcript to ARCHIVUM
        run: |
          VODID=$(echo "${{ inputs.vod_url }}" | grep -oE '[0-9]{6,}' | head -1)
          mkdir -p ARCHIVUM/montage/transcripts
          if [ ! -f "ARCHIVUM/montage/transcripts/v${VODID}_transcript.json" ]; then
            echo "::error::aucun transcript produit — une transcription absente ne se maquille pas en succes"
            exit 1
          fi
          git config user.name "MurusVox"
          git config user.email "vox@murus.sanguinis"
          git add ARCHIVUM/montage/transcripts
          git commit -m "[SF_05_VOX] transcript v${VODID} (Modal fan-out, 8 VM)" || echo "nothing to commit"
          for i in 1 2 3 4 5; do git pull --rebase --autostash origin main && git push origin main && exit 0; echo "push rejete, tentative $i"; sleep 6; done; echo "::warning::push impossible apres 5 tentatives" || echo "push failed"
