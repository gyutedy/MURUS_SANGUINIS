name: MURUS — SIÈGE RÉEL (VOD opérateur)

# Siège sur une VRAIE VOD avec la VRAIE directive (ARCHIVUM/campaign/campaign_directive.json).
# Rien ne tourne sur la machine de l'opérateur : tout ici, sur GitHub Actions.
#
# Deux jobs :
#   1. ingestion  — yt-dlp télécharge l'audio de la VOD, faster-whisper (CPU) transcrit,
#                   le transcript est COMMITÉ dans ARCHIVUM/montage/transcripts/ (payé une fois,
#                   relu autant de fois qu'on veut : c'est la doctrine de libs/transcript.py).
#   2. siege      — le moteur MARK1 est exécuté sur ce transcript. Les portes qui réclament
#                   une déclaration d'opérateur lisent ARCHIVUM/campaign/operator_declarations.json.
#                   Ce qui n'est pas déclaré n'est PAS inventé : la porte refuse, et le refus
#                   est écrit dans TRACKING/SIEGE_PREME.md.
#
# Aucun secret requis pour l'instant (pas de Modal déployé : transcription CPU locale au runner).

on:
  workflow_dispatch:
    inputs:
      vod_url:
        description: 'URL de la VOD'
        required: true
        default: 'https://www.twitch.tv/videos/2909800627'
        type: string
      # L'OPERATEUR REPOND ICI, AU LANCEMENT. Il n'edite jamais un fichier du repo
      # en plein siege : le projet enregistre sa reponse avec sa provenance.
      nb_clips:
        description: 'Nombre de clips (1 a 15) — reponse de l operateur a la question du projet'
        required: false
        default: ''
        type: string
      selection_approved:
        description: 'Valides-tu la selection M1 ? (oui/non) — reponse de l operateur'
        required: false
        default: ''
        type: string
      platform:
        description: 'Plateforme de destination'
        required: false
        default: 'youtube_shorts'
        type: string
      whisper_model:
        description: 'Modèle faster-whisper (base.en / small.en / medium.en)'
        required: false
        default: 'base.en'
        type: string
      transcription_chunks:
        description: 'Morceaux = VM Modal en parallèle (1 = série; 8 = huit conteneurs)'
        required: false
        default: '8'
        type: string
      max_minutes:
        description: 'Fenêtre max de la VOD transcrite (minutes)'
        required: false
        default: '180'
        type: string

permissions:
  contents: write

concurrency:
  group: siege-${{ inputs.vod_url }}
  cancel-in-progress: false

jobs:
  ingestion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Transcript déjà présent ? (le paiement d'une transcription ne se refait pas)
        id: deja
        env:
          VOD_URL: ${{ inputs.vod_url }}
        run: |
          VID=$(echo "$VOD_URL" | grep -oE '[0-9]{6,}' | head -1)
          if [ -f "ARCHIVUM/montage/transcripts/v${VID}_transcript.json" ]; then
            echo "transcript déjà dans ARCHIVUM pour v$VID : ingestion sautée"
            echo "skip=1" >> "$GITHUB_OUTPUT"
          else
            echo "skip=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Installer ffmpeg + yt-dlp + faster-whisper
        if: steps.deja.outputs.skip != '1'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          pip install yt-dlp faster-whisper modal

      - name: Télécharger l'audio de la VOD
        if: steps.deja.outputs.skip != '1'
        env:
          VOD_URL: ${{ inputs.vod_url }}
          MAX_MIN: ${{ inputs.max_minutes }}
        run: |
          mkdir -p /tmp/vod
          set +e
          yt-dlp --no-playlist -f bestaudio -o "/tmp/vod/audio.%(ext)s" "$VOD_URL" 2>&1 | tail -20
          RC=${PIPESTATUS[0]}
          echo "yt-dlp rc=$RC"
          if [ $RC -ne 0 ]; then echo "::error::téléchargement VOD impossible (rc=$RC) — VOD privée/expirée ou Twitch a changé"; exit $RC; fi
          IN=$(ls /tmp/vod/audio.* | head -1)
          echo "audio: $IN ($(du -h "$IN" | cut -f1))"
          # 16 kHz mono : ce que Whisper attend, et 10x plus léger à traiter.
          ffmpeg -y -loglevel error -i "$IN" -ac 1 -ar 16000 -t "$((MAX_MIN*60))" /tmp/vod/audio.wav
          ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 /tmp/vod/audio.wav | \
            awk '{printf "durée transcrite: %.1f min\n", $1/60}'

      - name: Transcrire (Modal fan-out multi-VM, repli CPU declare) -> format ARCHIVUM
        if: steps.deja.outputs.skip != '1'
        env:
          VOD_URL: ${{ inputs.vod_url }}
          MODEL: ${{ inputs.whisper_model }}
          CHUNKS: ${{ inputs.transcription_chunks }}
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          VID=$(echo "$VOD_URL" | grep -oE '[0-9]{6,}' | head -1)
          mkdir -p ARCHIVUM/montage/transcripts
          if [ -z "${MODAL_TOKEN_ID}" ]; then
            echo "::warning::MODAL_TOKEN_ID absent — la transcription retombe en CPU et le rapport le dira"
          fi
          python FR_A_CERVEAU/SF_05_VOX/CODEBASE/transcrire_vod.py \
            --vod /tmp/vod/audio.wav \
            --out "ARCHIVUM/montage/transcripts/v${VID}_transcript.json" \
            --chunks "${CHUNKS}" \
            --model "${MODEL}" \
            --language en \
            --max-minutes "${{ inputs.max_minutes }}" \
            --report "/tmp/transcription_report.json"
          cp /tmp/transcription_report.json "ARCHIVUM/montage/transcripts/v${VID}_transcription_report.json"

      - name: Committer le transcript dans ARCHIVUM
        if: steps.deja.outputs.skip != '1'
        run: |
          git config user.name "MurusVox"
          git config user.email "vox@murus.sanguinis"
          git add ARCHIVUM/montage/transcripts
          if git diff --cached --quiet; then echo "transcript déjà présent, rien à committer"; exit 0; fi
          git commit -m "[SIÈGE] transcript VOD réel (faster-whisper CPU, GitHub Actions)"
          for i in 1 2 3 4 5; do git pull --rebase --autostash origin main && git push origin main && exit 0; echo "push rejete, tentative $i"; sleep 6; done; echo "::warning::push impossible apres 5 tentatives"

  siege:
    runs-on: ubuntu-latest
    needs: ingestion
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Le job d'ingestion vient de committer le transcript sur main. Le checkout de ce job
      # est fige sur le SHA du run : sans ce fetch, le transcript paraissait absent.
      - name: Récupérer le transcript committé par l'ingestion
        run: |
          git fetch origin main
          git merge --ff-only origin/main
          ls -la ARCHIVUM/montage/transcripts/ | tail -5

      - name: DEMANDE À L'OPÉRATEUR — le projet demande, l'opérateur répond, le projet trace
        env:
          NB_IN: ${{ inputs.nb_clips }}
          SEL_IN: ${{ inputs.selection_approved }}
        run: |
          python - << 'PYEOF'
          import os, sys
          from pathlib import Path

          sys.path.insert(0, str(Path("FR_A_CERVEAU/GATES").resolve()))
          import demande

          CAP = 15
          nb_in = (os.environ.get("NB_IN") or "").strip()
          sel_in = (os.environ.get("SEL_IN") or "").strip().lower()

          # La reponse de l'operateur, si elle a ete donnee au lancement, est
          # ENREGISTREE par le projet (provenance : dispatch). Sinon on redemande.
          if nb_in:
              demande.enregistrer("nb_clips", nb_in, source="workflow_dispatch", root=".")
          if sel_in in ("oui", "yes", "true", "1"):
              demande.enregistrer("selection_approved", True, source="workflow_dispatch", root=".")
          elif sel_in in ("non", "no", "false", "0"):
              demande.enregistrer("selection_approved", False, source="workflow_dispatch", root=".")

          ok, nb, motif = demande.exiger("nb_clips", plafond=CAP, root=".")
          if not ok:
              pend = demande.demander(
                  "nb_clips",
                  "Combien de clips pour ce siège ?",
                  pourquoi="Le nombre de clips conditionne la sélection M1 : c'est une "
                            "décision d'opérateur, pas un défaut de workflow.",
                  attendu="entier entre 1 et %d" % CAP, plafond=CAP, root=".")
              print("=" * 72)
              print("LE PROJET DEMANDE À L'OPÉRATEUR")
              print("  question : %s" % pend)
              print("  réponse  : relancer ce workflow avec nb_clips = <1..%d>" % CAP)
              print("  refus    : %s" % motif)
              print("=" * 72)
              Path("/tmp/nb_clips.txt").write_text("", encoding="utf-8")
              sys.exit(1)
          print("nb_clips = %d (déclaré par l'opérateur, cap %d, tracé dans ARCHIVUM/demande/answers.json)"
                % (nb, CAP))
          Path("/tmp/nb_clips.txt").write_text(str(nb), encoding="utf-8")
          PYEOF
          echo "NB=$(cat /tmp/nb_clips.txt)" >> "$GITHUB_ENV"

      - name: Construire le pack d'entrée depuis les déclarations de l'opérateur
        env:
          VOD_URL: ${{ inputs.vod_url }}
          NB: ${{ env.NB }}
        run: |
          python - << 'PYEOF'
          import json, os, re
          from pathlib import Path

          decl = json.loads(Path("ARCHIVUM/campaign/operator_declarations.json").read_text(encoding="utf-8"))
          pack = {
              "mode": "mark1",
              # Token EXPLICITE : les reponses ORACLE sont scopees a ce pack. Sans lui,
              # les titres du siege s'appliqueraient a tout autre pack (e2e, campagne future).
              "pack_token": "siege_preme",
              "source": {"vod_url": os.environ["VOD_URL"]},
              "asset_mode": "blur",
              "nb_segments": int(os.environ["NB"]),
              # déclarations d'opérateur : recopiées telles quelles, null compris
              "account": decl.get("account") or {},
              "campaign": decl.get("campaign") or {},
              "focus_declared": decl.get("focus_declared"),
              "_declared_by": decl.get("declared_by"),
          }
          Path("/tmp/pack_siege.json").write_text(json.dumps(pack, indent=1), encoding="utf-8")
          pending = [k for k, v in (decl.get("account") or {}).items() if v is None]
          pending += ["campaign." + k for k, v in (decl.get("campaign") or {}).items() if v is None]
          if decl.get("focus_declared") is None:
              pending.append("focus_declared")
          print("pack de siège écrit. Déclarations encore NULL (=> la porte refusera) :",
                pending or "aucune")
          PYEOF

      - name: M1 sur données réelles — quels moments la VOD offre-t-elle ?
        env:
          VOD_URL: ${{ inputs.vod_url }}
          NB: ${{ env.NB }}
        run: |
          python - << 'PYEOF' 2>&1 | tee /tmp/m1.log
          import importlib.util, json, os, sys
          from pathlib import Path

          root = Path("FR_A_CERVEAU/MARK1").resolve()
          sys.path.insert(0, str(root))

          def load(rel, name):
              spec = importlib.util.spec_from_file_location(name, root / rel)
              mod = importlib.util.module_from_spec(spec)
              spec.loader.exec_module(mod)
              return mod

          cfg = json.loads((root / "config" / "selection.json").read_text(encoding="utf-8"))
          directiva = load("M00A_DIRECTIVA/CODEBASE/directiva.py", "directiva")
          selector = load("M00B_SELECTOR/CODEBASE/selector.py", "selector")
          from libs import gates, transcript as tr

          directive = directiva.run(cfg, str(root))
          vod = os.environ["VOD_URL"]
          path = tr.find_transcript(cfg, str(root), vod)
          doc = tr.load(path)
          windows = tr.candidate_windows(doc, cfg, limit=int(os.environ["NB"]))

          # ---- CONDITION 4 DE LA REGLE ANTI-REMPLISSAGE, VERIFIEE A M1 ----
          # Un clip dont le texte ne peut porter AUCUN overlay valide (title_forge +
          # S1 + soutien anti-bait) n'est pas un clip. Il est ecarte ICI, avec sa
          # raison, au lieu de faire echouer M2B plus tard et de tout arreter.
          sys.path.insert(0, str(Path("FR_A_CERVEAU/GATES").resolve()))
          import faisabilite_overlay as fo
          gardes, ecartes = [], []
          for w in windows:
              f_ok, titre, why = fo.faisable(w["source_text"], cfg, str(root))
              if f_ok:
                  w["_overlay_propose"] = titre
                  gardes.append(w)
              else:
                  ecartes.append({"start_sec": w["start_sec"], "force": w["score"],
                                  "text": (w["source_text"] or "")[:160], "raisons": why})
          print("FAISABILITE OVERLAY : %d gardees, %d ecartees sur %d proposees"
                % (len(gardes), len(ecartes), len(windows)))
          for e in ecartes:
              print("  ECARTEE %.1fs force=%s — %s | %s"
                    % (e["start_sec"], e["force"], "; ".join(e["raisons"]), e["text"][:70]))
          windows = gardes
          if not windows:
              print("::error::aucune fenetre ne peut porter d'overlay : le siege ne peut rien rendre")
              sys.exit(1)

          pack = {"mode": "mark1", "assets": [
              {"id": "A%02d" % (i + 1), "start_sec": w["start_sec"],
               "end_sec": w["end_sec"], "source_text": w["source_text"]}
              for i, w in enumerate(windows)]}

          # Les titres d'overlay des clips GARDES : ce sont des SUITES DE MOTS DU TEXTE
          # trouvees par faisabilite_overlay (title_forge + S1 + anti-bait). Ce n'est pas
          # une invention : c'est le texte. Ils sont ecrits avec leur provenance et
          # soumis a l'operateur avec la selection (il voit le clip ET son titre).
          titres = {"pack_token": "siege_preme", "answers": []}
          for i, w in enumerate(windows):
              titres["answers"].append({
                  "asset_id": "A%02d" % (i + 1),
                  "pack_token": "siege_preme",
                  "candidates": [w["_overlay_propose"]]})
          titres["_author"] = "derive mecaniquement du texte (FR_A_CERVEAU/GATES/faisabilite_overlay.py)"
          titres["_note"] = ("Aucun titre invente : chaque titre est une suite de mots du "
                             "transcript, acceptee par les juges du moteur. Verifie par "
                             "TRACKING/DOCTRINE_ANTI_REMPLISSAGE.md condition 4.")
          Path("FR_A_CERVEAU/ORACLE/answers.json").write_text(
              json.dumps(titres, indent=2, ensure_ascii=False), encoding="utf-8")

          # Le pack EXPORTE est EXACTEMENT la selection validee : on ne laisse pas
          # mark1.py reconstruire ses fenetres depuis le transcript, sinon les clips
          # ecartes reviennent (ids A10..A15 sans reponse => attente ORACLE infinie).
          pack["source"] = {"vod_url": os.environ["VOD_URL"], "transcript_path": path}
          pack["nb_demande"] = nb_demande if "nb_demande" in dir() else int(os.environ["NB"])
          pack["nb_retenu"] = len(pack["assets"])
          pack["manque"] = max(0, int(os.environ["NB"]) - len(pack["assets"]))
          pack["remplissage_refuse"] = bool(pack["manque"])
          base = json.loads(Path("/tmp/pack_siege.json").read_text(encoding="utf-8"))
          base["assets"] = pack["assets"]
          base["source"] = pack["source"]
          for k in ("nb_demande", "nb_retenu", "manque", "remplissage_refuse"):
              base[k] = pack[k]
          Path("/tmp/pack_siege.json").write_text(
              json.dumps(base, indent=1, ensure_ascii=False), encoding="utf-8")
          print("pack exporte = selection validee : %d assets (demande %d, manque %d)"
                % (base["nb_retenu"], base["nb_demande"], base["manque"]))
          segs = selector.select(pack, directive, cfg, str(root))
          ok, code, msg = gates.m1_selection(segs, directive, cfg)
          print("transcript :", Path(path).name, "|", len(windows), "fenetres")
          print("M1_SELECTION :", ok, code, msg)

          # FORCE de chaque fenetre : score rendu par candidate_windows
          # (marqueurs d'enjeu + 2 x chiffres). Sans ce chiffre, la selection
          # n'etait pas discutable : l'operateur ne pouvait pas valider.
          forces = [int(w.get("score") or 0) for w in windows]
          rows = []
          for i, s_ in enumerate(segs):
              a, b = float(s_.get("start_sec") or 0), float(s_.get("end_sec") or 0)
              txt = " ".join((s_.get("source_text") or "").split())
              force = forces[i] if i < len(forces) else 0
              print("  %s  force=%-3d %7.1fs -> %7.1fs  (%4.1fs)  %s"
                    % (s_.get("id"), force, a, b, b - a, txt[:100]))
              rows.append({"id": s_.get("id"), "start": a, "end": b,
                           "force": force, "text": txt[:400],
                           "overlay_propose": (windows[i].get("_overlay_propose")
                                               if i < len(windows) else None)})
          # REGLE ANTI-REMPLISSAGE : on annonce le compte reel, jamais un compte gonfle.
          nb_demande = int(os.environ["NB"])
          nb_retenu = len(rows)
          manque = max(0, nb_demande - nb_retenu)
          print("ANTI-REMPLISSAGE : demande %d, retenu %d, manque %d%s"
                % (nb_demande, nb_retenu, manque,
                   " — aucun clip de remplissage" if manque else " — compte tenu"))
          Path("/tmp/m1.json").write_text(json.dumps(
              {"gate": {"ok": ok, "code": code, "msg": msg},
               "nb_demande": nb_demande, "nb_retenu": nb_retenu, "manque": manque,
               "remplissage_refuse": bool(manque), "ecartes": ecartes,
               "segments": rows}, indent=1),
              encoding="utf-8")

          # La selection est SOUMISE a l'operateur, pas consommee d'office.
          sys.path.insert(0, str(Path("FR_A_CERVEAU/GATES").resolve()))
          import demande
          if manque:
              question = ("Tu as demande %d clips, la VOD n'en fournit que %d qui "
                          "remplissent les conditions. Valides-tu ces %d, sans remplissage ?"
                          % (nb_demande, nb_retenu, nb_retenu))
          else:
              question = "Valides-tu ces %d clips ?" % nb_retenu
          pend = demande.demander(
              "selection",
              question,
              pourquoi="M1 propose, l'operateur decide : rien n'est rendu avant validation. "
                        "Aucun clip de remplissage n'est ajoute pour atteindre le chiffre demande.",
              attendu='{"selection_approved": true} (ou false + "selection_note")',
              payload={"vod": os.environ["VOD_URL"], "nb_demande": nb_demande,
                       "nb_retenu": nb_retenu, "manque": manque, "clips": rows}, root=".")
          print("SELECTION SOUMISE A VALIDATION :", pend)
          print("pour valider : relancer ce workflow avec selection_approved = oui")
          print("pour refuser : selection_approved = non")
          PYEOF

      - name: Refus si la sélection n'est pas validée par l'opérateur
        run: |
          python - << 'PYEOF'
          import sys
          from pathlib import Path
          sys.path.insert(0, str(Path("FR_A_CERVEAU/GATES").resolve()))
          import demande
          ok, val, motif = demande.exiger("selection_approved", root=".")
          if not ok or val is not True:
              print("::error::sélection non validée par l'opérateur — aucun clip ne sort")
              print("=" * 72)
              print("LE PROJET ATTEND TA RÉPONSE (tu n'écris rien dans le repo)")
              print("  la sélection est ici : ARCHIVUM/demande/pending/selection.json")
              print("  pour l'accepter : relancer ce workflow avec selection_approved = oui")
              print("  pour la refuser  : relancer avec selection_approved = non")
              print("  refus moteur     : %s" % motif)
              print("=" * 72)
              sys.exit(1)
          print("sélection validée par l'opérateur")
          PYEOF

      - name: SIÈGE — mark1 export sur la VOD réelle (refus attendus si l'opérateur n'a pas déclaré)
        env:
          PLATFORM: ${{ inputs.platform }}
          NB: ${{ env.NB }}
          VOD_URL: ${{ inputs.vod_url }}
        run: |
          VID=$(echo "$VOD_URL" | grep -oE '[0-9]{6,}' | head -1)
          TR="ARCHIVUM/montage/transcripts/v${VID}_transcript.json"
          test -f "$TR" || { echo "::error::transcript absent : $TR"; exit 1; }
          set +e
          python FR_A_CERVEAU/MARK1/mark1.py export /tmp/pack_siege.json \
            --transcript "$TR" --platform "$PLATFORM" --nb-segments "$NB" 2>&1 | tee /tmp/siege.log
          echo "SIEGE_RC=${PIPESTATUS[0]}" >> "$GITHUB_ENV"

      - name: Rapport de siège (états réels + ce qui manque à l'opérateur)
        if: always()
        env:
          VOD_URL: ${{ inputs.vod_url }}
          PLATFORM: ${{ inputs.platform }}
        run: |
          python - << 'PYEOF'
          import json, os, re, datetime
          from pathlib import Path

          log = Path("/tmp/siege.log")
          txt = log.read_text(encoding="utf-8", errors="replace") if log.exists() else ""
          lines = [l for l in txt.splitlines() if re.match(r"^\[(OK|FAIL|WAIT)\]", l)]
          trace = re.findall(r"trace=(\S+)", txt)
          rc = os.environ.get("SIEGE_RC", "?")

          m1 = {}
          if Path("/tmp/m1.json").exists():
              m1 = json.loads(Path("/tmp/m1.json").read_text(encoding="utf-8"))

          decl = json.loads(Path("ARCHIVUM/campaign/operator_declarations.json").read_text(encoding="utf-8"))
          pending = [k for k, v in (decl.get("account") or {}).items() if v is None]
          pending += ["campaign." + k for k, v in (decl.get("campaign") or {}).items() if v is None]
          if decl.get("focus_declared") is None:
              pending.append("focus_declared")

          out = []
          out.append("# SIÈGE RÉEL / REAL SIEGE — %s" % datetime.datetime.utcnow().strftime("%Y-%m-%d %H:%M UTC"))
          out.append("")
          out.append("Document bilingue (EXC-M8, `TRACKING/DOCTRINE_BILINGUE.md`) : EN = source de")
          out.append("vérité machine, FR = traduction de compréhension.")
          out.append("")
          out.append("- VOD : `%s`" % os.environ.get("VOD_URL", ""))
          out.append("- plateforme / platform : `%s`" % os.environ.get("PLATFORM", ""))
          out.append("- directive : `ARCHIVUM/campaign/campaign_directive.json`")
          out.append("- code retour moteur / engine rc : `%s` (0 = siège complet, 2 = porte fermée, 3 = ORACLE attendu)" % rc)
          out.append("")

          def bloc_tables(titre_chain, titre_m1, titre_decl, champs, etat_non, etat_ok, note):
              out.append("## " + titre_chain)
              out.append("")
              out.append("```")
              out.extend(lines or ["(aucune porte atteinte / no gate reached)"])
              out.append("```")
              if trace:
                  out.append("")
                  out.append("Traces : " + ", ".join("`%s`" % t for t in trace))
              out.append("")
              out.append("## " + titre_m1)
              out.append("")
              if m1:
                  g = m1.get("gate") or {}
                  out.append("Porte / gate : **%s** — %s" % (g.get("code"), g.get("msg")))
                  out.append("")
                  out.append("| id | %s | | %s |" % (champs[0], champs[1]))
                  out.append("|---|---|---|---|")
                  for sg in m1.get("segments") or []:
                      out.append("| %s | %.1fs → %.1fs (%.1fs) | force=%s | %s |" % (
                          sg.get("id"), float(sg.get("start") or 0), float(sg.get("end") or 0),
                          float(sg.get("end") or 0) - float(sg.get("start") or 0),
                          sg.get("force"),
                          " ".join((sg.get("text") or "")[:180].split()).replace("|", "/")))
              else:
                  out.append("(pas de sélection / no selection: la chaîne s'est arrêtée avant M1)")
              out.append("")
              out.append("## " + titre_decl)
              out.append("")
              out.append("Fichier / file : `ARCHIVUM/campaign/operator_declarations.json`")
              out.append("")
              out.append("| champ / field | état / state |")
              out.append("|---|---|")
              for k in pending or ["—"]:
                  out.append("| `%s` | %s |" % (k, etat_non))
              if not pending:
                  out.append("| — | %s |" % etat_ok)
              out.append("")
              out.append(note)
              out.append("")

          bloc_tables(
              "EN — Gate chain (real engine output)",
              "EN — M1 on real data",
              "EN — What the operator must declare (nothing is guessed)",
              ("window", "transcript (real VOD)"),
              "**undeclared → gate refused**",
              "all declarations provided (example values, EXC-M7)",
              "Filling this file = answering the gates. The code never invents a value.")
          bloc_tables(
              "FR — Chaîne des portes (sortie réelle du moteur)",
              "FR — M1 sur données réelles",
              "FR — Ce que l'opérateur doit déclarer (rien n'est deviné)",
              ("fenêtre", "texte réel de la VOD"),
              "**non déclaré → porte refusée**",
              "toutes les déclarations sont fournies (valeurs d'exemple, EXC-M7)",
              "Compléter ce fichier = répondre aux portes. Aucune valeur n'est inventée par le code.")
          Path("TRACKING/SIEGE_PREME.md").write_text("\n".join(out) + "\n", encoding="utf-8")
          print("\n".join(out))
          PYEOF

      - name: Stager le pack exporte pour la review (REVIEW/pack_stage.json)
        if: always()
        run: |
          python - << 'PYEOF'
          import glob, json, shutil
          from pathlib import Path
          packs = sorted(glob.glob("EXPORT/production_pack_mark1_*.json"))
          if not packs:
              print("aucun pack exporte : la review n'a rien a stager")
              raise SystemExit(0)
          src = Path(packs[-1])
          d = json.loads(src.read_text(encoding="utf-8"))
          Path("REVIEW").mkdir(exist_ok=True)
          Path("REVIEW/pack_stage.json").write_text(
              json.dumps(d, indent=2, ensure_ascii=False), encoding="utf-8")
          print("pack stagé pour la review : %s -> REVIEW/pack_stage.json (%d clips, token %s)"
                % (src.name, len(d.get("assets") or []), d.get("pack_token")))
          PYEOF

      - name: Committer le rapport de siège
        if: always()
        run: |
          git config user.name "MurusSiege"
          git config user.email "siege@murus.sanguinis"
          git add TRACKING/SIEGE_PREME.md
          git add REVIEW/pack_stage.json || true
          if git diff --cached --quiet; then echo "rapport inchangé"; exit 0; fi
          git commit -m "[SIÈGE] rapport réel sur la VOD opérateur"
          for i in 1 2 3 4 5; do git pull --rebase --autostash origin main && git push origin main && exit 0; echo "push rejete, tentative $i"; sleep 6; done; echo "::warning::push impossible apres 5 tentatives"

      - name: Publier ce que le projet a écrit à l'opérateur (question + sélection)
        if: always()
        run: |
          git config user.name "MurusDemande"
          git config user.email "demande@murus.sanguinis"
          git add ARCHIVUM/demande || true
          # La question de l'ORACLE appartient a l'operateur : elle doit etre
          # publiee comme les autres, sinon il ne peut pas y repondre.
          git add FR_A_CERVEAU/ORACLE || true
          if git diff --cached --quiet; then echo "aucune question à publier"; exit 0; fi
          git commit -m "[DEMANDE] question + sélection soumise à l'opérateur"
          git pull --rebase --autostash origin main
          for i in 1 2 3 4 5; do git pull --rebase --autostash origin main && git push origin main && exit 0; echo "push rejete, tentative $i"; sleep 6; done; echo "::warning::push impossible apres 5 tentatives"

      - name: Échec assumé — la porte a refusé ce qu'elle devait refuser
        if: env.SIEGE_RC != '0'
        run: |
          echo "::warning::le moteur a refusé le siège (rc=$SIEGE_RC) — c'est une porte, pas un bug."
          echo "Voir TRACKING/SIEGE_PREME.md pour le détail et les déclarations manquantes."
