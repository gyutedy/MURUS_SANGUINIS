name: MURUS — tests e2e + doctrine

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  doctrine:
    name: T0 — le cerveau ne touche jamais une vidéo (R3, EXC-M1/M2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aucune INVOCATION ffmpeg/libx264 dans FR_A_CERVEAU (hors capteur detect/, EXC-M1)
        run: |
          if grep -rniE "(subprocess|os\.system|popen).*ffmpeg|ffmpeg.*(run\(|call\()" FR_A_CERVEAU/ --exclude-dir=detect --include="*.py" --include="*.js" --include="*.sh" ; then
            echo "::error::La frégate cerveau INVOQUE ffmpeg hors capteur — doctrine violée (EXC-M1)"
            exit 1
          fi
      - name: VEXILLUM ne POSE jamais le watermark (EXC-M2)
        run: |
          if grep -rniE "subprocess|ffmpeg|libx264|drawtext" FR_A_CERVEAU/SF_07_VEXILLUM/ --include="*.py" ; then
            echo "::error::VEXILLUM applique le watermark — interdit (EXC-M2)"
            exit 1
          fi

  tests:
    name: 16 tests e2e (statut ATTENDU -> sortie réelle)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install ffmpeg (requis par T13/T15)
        run: sudo apt-get update -y && sudo apt-get install -y ffmpeg
      - name: Run tests/test_murus.py
        run: python tests/test_murus.py

      - name: Run tests/test_murus_v2.py (portes T20-T22, V2)
        run: python tests/test_murus_v2.py

      - name: Portes Telegram (NUNTIUS)
        run: python tests/test_nuntius_telegram.py

      - name: Portes des verdicts (l'acte de l'operateur)
        run: python tests/test_verdicts.py

      - name: Portes de /lancer (aucune fregate sans porte ouverte)
        run: python tests/test_lancer.py

      - name: Portes des campagnes (une seule active, directive sans perte)
        run: python tests/test_campagnes.py
      - name: Consigner la sortie réelle dans TRACKING/MURUS_LOG.md
        if: always()
        run: |
          python tests/test_murus.py | tee /tmp/tests_out.txt || true
          {
            echo ""
            echo "## Sortie réelle tests — run $GITHUB_RUN_ID ($(date -u +%F))"
            printf '\n```\n'
            cat /tmp/tests_out.txt
            printf '```\n'
          } >> TRACKING/MURUS_LOG.md
          git config user.name "MurusCI"
          git config user.email "murus@murus.sanguinis"
          git add TRACKING/MURUS_LOG.md
          NB=$(grep -c "^PASS " /tmp/tests_out.txt 2>/dev/null || echo 0)
          git commit -m "[CI] sortie réelle des ${NB} portes e2e (remplace ATTENDU)" || echo "nothing to commit"
          for i in 1 2 3 4 5; do git pull --rebase --autostash origin main && git push origin main && exit 0; echo "push rejete, tentative $i"; sleep 6; done; echo "::warning::push impossible apres 5 tentatives" || echo "push failed (fork/PR)"
