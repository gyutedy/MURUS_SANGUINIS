name: MURUS — PREVIEW 1 (SF_10_SPECULUM, LOOK sur clips réels)

# PREVIEW 1 = ce que l'opérateur regarde pour décider du LOOK (style du titre T1,
# taille de la vidéo claire, place du logo W1). Elle ne rend RIEN de définitif :
# elle prépare le codex_render.json que l'opérateur signe.
#
# Entrées : REVIEW/pack_stage.json (pack réellement exporté par le siège) + la VOD.
# Le workflow RÉCUPÈRE les clips du pack (yt-dlp section + ffmpeg), les met dans
# public/clips/, place le watermark de campagne, construit la review et la publie.
#
# Aucune décision ici : ni style, ni codex. Le codex est écrit par l'opérateur
# dans la page, puis signé.

on:
  workflow_dispatch:
    inputs:
      vod_url:
        description: 'VOD source (si absente du pack)'
        required: false
        default: 'https://www.twitch.tv/videos/2909800627'
        type: string
      watermark:
        description: 'PNG du watermark dans ARCHIVUM/campaign/watermarks/'
        required: false
        default: 'preme.png'
        type: string
      publish_pages:
        description: 'Publier sur GitHub Pages (oui/non)'
        required: false
        default: 'oui'
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  preview1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Installer ffmpeg + yt-dlp
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg
          python -m pip install --quiet --upgrade yt-dlp
          ffmpeg -version | head -1
          yt-dlp --version

      - name: Y a-t-il un pack exporté à reviewer ?
        id: pack
        run: |
          if [ -f REVIEW/pack_stage.json ]; then
            echo "found=1" >> "$GITHUB_OUTPUT"
            python - << 'PYEOF'
          import json
          d = json.load(open("REVIEW/pack_stage.json", encoding="utf-8"))
          print("pack : token=%s clips=%d (demandé %s, manque %s)"
                % (d.get("pack_token"), len(d.get("assets") or []),
                   d.get("nb_demande"), d.get("manque")))
          PYEOF
          else
            echo "found=0" >> "$GITHUB_OUTPUT"
            echo "::warning::aucun REVIEW/pack_stage.json — lance d'abord le siège réel"
          fi

      - name: Récupérer les clips du pack (fenêtres réelles, pas la VOD entière)
        if: steps.pack.outputs.found == '1'
        env:
          VOD_FALLBACK: ${{ inputs.vod_url }}
        run: |
          python - << 'PYEOF'
          import json, os, subprocess, glob
          from pathlib import Path

          pack = json.loads(Path("REVIEW/pack_stage.json").read_text(encoding="utf-8"))
          vod = (pack.get("source") or {}).get("vod_url") or os.environ["VOD_FALLBACK"]
          out = Path("FR_B_CREATION/SF_10_SPECULUM/CODEBASE/public/clips")
          out.mkdir(parents=True, exist_ok=True)
          wm_dir = Path("FR_B_CREATION/SF_10_SPECULUM/CODEBASE/public/watermarks")
          wm_dir.mkdir(parents=True, exist_ok=True)

          total = 0
          for a in pack.get("assets") or []:
              aid = a.get("id") or "clip"
              start = float(a.get("start_sec") or 0)
              end = float(a.get("end_sec") or (start + 30))
              dur = max(1.0, end - start)
              work = Path("/tmp/recup") / aid
              work.mkdir(parents=True, exist_ok=True)
              src_pat = str(work / "src.%(ext)s")
              rc = subprocess.run(["yt-dlp", "--no-playlist",
                                   "-f", "bv*[height<=1080]+ba/b[height<=1080]",
                                   "--download-sections", "*%s-%s" % (start, end + 1),
                                   "--force-keyframes-at-cuts", "-o", src_pat, vod]).returncode
              hits = sorted(glob.glob(str(work / "src.*")))
              if rc != 0 or not hits:
                  print("::warning::clip %s non récupéré (%.1fs)" % (aid, start))
                  continue
              dest = out / ("%s.mp4" % aid)
              rc = subprocess.run(["ffmpeg", "-y", "-loglevel", "error", "-i", hits[0],
                                   "-t", str(dur), "-c:v", "libx264", "-preset", "veryfast",
                                   "-crf", "18", "-c:a", "aac", "-b:a", "128k",
                                   "-movflags", "+faststart", str(dest)]).returncode
              if rc != 0:
                  print("::warning::coupe ffmpeg échouée pour %s" % aid)
                  continue
              # le LOOK cherche clips/<id>.mp4 ET clips/pur_<id>.mp4
              subprocess.run(["cp", str(dest), str(out / ("pur_%s.mp4" % aid))])
              print("clip %s : %.1fs -> %.1fs (%.1fs) -> %s"
                    % (aid, start, end, dur, dest.relative_to(out.parent.parent.parent.parent)))
              total += 1
          print("clips récupérés : %d" % total)
          Path("/tmp/clips_count.txt").write_text(str(total), encoding="utf-8")
          PYEOF

      - name: Stager le pack + le watermark dans la review
        if: steps.pack.outputs.found == '1'
        env:
          WM: ${{ inputs.watermark }}
        run: |
          python - << 'PYEOF'
          import json, os, shutil
          from pathlib import Path

          base = Path("FR_B_CREATION/SF_10_SPECULUM/CODEBASE")
          pub = base / "public"
          pack = json.loads(Path("REVIEW/pack_stage.json").read_text(encoding="utf-8"))

          wm_name = os.environ.get("WM") or "preme.png"
          src_wm = Path("ARCHIVUM/campaign/watermarks") / wm_name
          if not src_wm.exists():
              raise SystemExit("::error::watermark absent : %s" % src_wm)
          (pub / "watermarks").mkdir(parents=True, exist_ok=True)
          shutil.copy2(src_wm, pub / "watermarks" / wm_name)

          wm = pack.get("watermark") or {}
          wm["file"] = "watermarks/%s" % wm_name
          wm.setdefault("required", True)
          wm.setdefault("enabled", True)
          pack["watermark"] = wm
          (pub / "pack.json").write_text(json.dumps(pack, indent=2, ensure_ascii=False),
                                         encoding="utf-8")
          print("pack stagé : public/pack.json | watermark: %s (opacity=%s, position=%s, size=%s)"
                % (wm["file"], wm.get("opacity"), wm.get("position"), wm.get("size_pct")))
          PYEOF

      - name: Construire la review (Vite)
        if: steps.pack.outputs.found == '1'
        working-directory: FR_B_CREATION/SF_10_SPECULUM/CODEBASE
        run: |
          npm ci --no-audit --no-fund
          npm run build
          ls -la dist | head -8

      - name: Résumé opérateur
        if: always()
        run: |
          {
            echo "## PREVIEW 1 — LOOK"
            echo ""
            if [ "${{ steps.pack.outputs.found }}" = "1" ]; then
              echo "- pack : \`REVIEW/pack_stage.json\`"
              echo "- clips récupérés : $(cat /tmp/clips_count.txt 2>/dev/null || echo 0)"
              echo "- watermark : \`${{ inputs.watermark }}\`"
              echo ""
              echo "**EN** — Open the page, tune the LOOK (title style T1, clear-video size,"
              echo "logo position), then **Export** to write \`REVIEW/codex_render.json\`."
              echo "Nothing is rendered until that codex is signed."
              echo ""
              echo "**FR** — Ouvre la page, règle le LOOK (style du titre T1, taille de la vidéo"
              echo "claire, place du logo), puis **Export** pour écrire \`REVIEW/codex_render.json\`."
              echo "Rien n'est rendu avant la signature de ce codex."
            else
              echo "Aucun pack : lance d'abord \`MURUS — SIÈGE RÉEL\`."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publier la review (artefact téléchargeable)
        if: steps.pack.outputs.found == '1'
        uses: actions/upload-artifact@v4
        with:
          name: preview-1-look
          path: FR_B_CREATION/SF_10_SPECULUM/CODEBASE/dist
          retention-days: 14

      - name: Publier sur GitHub Pages
        if: steps.pack.outputs.found == '1' && inputs.publish_pages == 'oui'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: FR_B_CREATION/SF_10_SPECULUM/CODEBASE/dist
          publish_branch: gh-pages
          force_orphan: true
