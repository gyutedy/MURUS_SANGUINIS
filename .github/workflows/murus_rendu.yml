name: MURUS — CHAÎNE COMPLÈTE (murus.py, aucune étape sautée)

# ENTRÉE UNIQUE ET UNIQUE CHEMIN : murus.py.
#
# Il n'y a PAS de "workflow de rendu" séparé. Un rendu direct en ffmpeg a été
# tenté et ANNULE le 2026-11-20 : il sautait 7 étapes gravées de FR_B.
#
# La chaîne que murus.py applique, dans l'ordre, sans possibilité de sauter :
#
#   FR_A (décide)                      FR_B (exécute, ne décide jamais)
#   D0_DIRECTIVE                       V5  -> SF_10_SPECULUM   (preview LOOK)  -> codex_render.json signé
#   M0B_CYCLE                          V6  -> SF_11_LUMEN      (preview GLOW 1 frame) -> codex_postprod.json signé
#   M1_SELECTION                       G1  -> SF_12_FABRICA    (rendu, piloté par les 2 codex signés)
#   M5_VOX                             PP2 -> SF_13_POLITURA   (glow -> caption -> lut -> fade)
#   M2_METADATA (ORACLE, EXC-1)            -> SF_14_CAMOUFLAGE (post-rendu, SANS gate)
#   M2B_COMPLIANCE                         -> SF_15_LUTHER     (post-rendu, SANS gate)
#   M3_WATERMARK                       V7  -> SF_16_MISSIO     (livraison refusée si qa_pass=false)
#   A1_ACCOUNT
#   A2_CAMPAIGN
#   X1_EXPORT (pack + sieges + ledger)
#
# Rien ne s'exécute si une porte refuse : c'est le comportement voulu.
# Les déclarations d'opérateur vivent dans ARCHIVUM/campaign/operator_declarations.json.

on:
  workflow_dispatch:
    inputs:
      vod_url:
        description: 'URL de la VOD'
        required: true
        default: 'https://www.twitch.tv/videos/2909800627'
        type: string
      profile:
        description: 'Profil : vod (avec previews codex) ou direct (codex réutilisés)'
        required: false
        default: 'vod'
        type: choice
        options: ['vod', 'direct']
      platform:
        description: 'Plateforme'
        required: false
        default: 'youtube_shorts'
        type: string
      nb_segments:
        description: 'Nombre de clips'
        required: false
        default: '3'
        type: string

permissions:
  contents: write

jobs:
  chaine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer ffmpeg + node (CLIs pillées)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg
          node --version

      - name: ÉTAT DE L'ORDRE — ce qui est signé, ce qui manque (aucune invention)
        id: ordre
        run: |
          python - << 'PYEOF' | tee /tmp/ordre.txt
          import json
          from pathlib import Path

          chain = [
              ("FR_A", "D0_DIRECTIVE", None),
              ("FR_A", "M0B_CYCLE", None),
              ("FR_A", "M1_SELECTION", None),
              ("FR_A", "M5_VOX", None),
              ("FR_A", "M2_METADATA", None),
              ("FR_A", "M2B_COMPLIANCE", None),
              ("FR_A", "M3_WATERMARK", None),
              ("FR_A", "A1_ACCOUNT", None),
              ("FR_A", "A2_CAMPAIGN", None),
              ("FR_A", "X1_EXPORT", "EXPORT/production_pack_mark1_*.json"),
              ("FR_B", "V5  SF_10_SPECULUM", "REVIEW/codex_render.json"),
              ("FR_B", "V6  SF_11_LUMEN", "REVIEW/codex_postprod.json"),
              ("FR_B", "G1  SF_12_FABRICA", "FR_B_CREATION/SF_12_FABRICA/OUT/clips"),
              ("FR_B", "PP2 SF_13_POLITURA", "FR_B_CREATION/SF_13_POLITURA/OUT/postprod_report.json"),
              ("FR_B", "    SF_14_CAMOUFLAGE (sans gate)", None),
              ("FR_B", "    SF_15_LUTHER (sans gate)", None),
              ("FR_B", "V7  SF_16_MISSIO", "FR_B_CREATION/SF_16_MISSIO/OUT/submissions.json"),
          ]
          manquants = 0
          for suite, nom, artefact in chain:
              if artefact is None:
                  print("  [--] %-4s %s" % (suite, nom))
                  continue
              hits = list(Path(".").glob(artefact))
              state = "OK " if hits else "MANQUE"
              if not hits:
                  manquants += 1
              print("  [%s] %-4s %s  (%s)" % (state, suite, nom, artefact))

          # Les codex doivent en plus porter la signature du Magos.
          for cx in ("REVIEW/codex_render.json", "REVIEW/codex_postprod.json"):
              p = Path(cx)
              if p.exists():
                  d = json.loads(p.read_text(encoding="utf-8"))
                  print("  codex %s -> validated_by_magos=%r" % (cx, d.get("validated_by_magos")))
          print("")
          print("ÉTAPES NON SATISFAITES : %d" % manquants)
          Path("/tmp/manquants.txt").write_text(str(manquants), encoding="utf-8")
          PYEOF
          echo "MANQUANTS=$(cat /tmp/manquants.txt)" >> "$GITHUB_ENV"

      - name: Refus explicite si l'ordre n'est pas respecté
        if: env.MANQUANTS != '0'
        run: |
          echo "::error::chaîne incomplète : $MANQUANTS étape(s) non satisfaite(s). Aucun rendu, aucun contournement."
          echo "Voir /tmp/ordre.txt (journal ci-dessus). Remplir d'abord les déclarations d'opérateur puis relancer murus.py."
          exit 1

      - name: CHAÎNE COMPLÈTE — murus.py (le seul chemin)
        if: env.MANQUANTS == '0'
        env:
          VOD_URL: ${{ inputs.vod_url }}
          PROFILE: ${{ inputs.profile }}
          PLATFORM: ${{ inputs.platform }}
          NB: ${{ inputs.nb_segments }}
        run: |
          python - << 'PYEOF'
          import json, os
          from pathlib import Path
          decl = json.loads(Path("ARCHIVUM/campaign/operator_declarations.json").read_text(encoding="utf-8"))
          pack = {"mode": "mark1",
                  "source": {"vod_url": os.environ["VOD_URL"]},
                  "asset_mode": "blur",
                  "account": decl.get("account") or {},
                  "campaign": decl.get("campaign") or {},
                  "focus_declared": decl.get("focus_declared")}
          Path("/tmp/pack_chaine.json").write_text(json.dumps(pack, indent=1), encoding="utf-8")
          print("pack écrit depuis les déclarations d'opérateur")
          PYEOF
          VID=$(echo "$VOD_URL" | grep -oE '[0-9]{6,}' | head -1)
          python murus.py --profile "$PROFILE" --pack /tmp/pack_chaine.json \
            --transcript "ARCHIVUM/montage/transcripts/v${VID}_transcript.json" \
            --platform "$PLATFORM"

      - name: Journal de chaîne (artefact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: journal-chaine
          path: |
            /tmp/ordre.txt
            TRACKING/*.md
            EXPORT/*.json
          retention-days: 7
          if-no-files-found: warn
