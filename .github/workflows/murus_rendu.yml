name: MURUS — RENDU (un job par clip, deux codex signes, aucune etape sautee)

# CE WORKFLOW REMPLACE L'ANCIEN "chaine" (un seul job qui rendait tout en serie).
# Doctrine (consigne operateur) : UN JOB PAR CLIP, fail-fast desactive — un clip
# casse ne tue pas les autres, et le declenchement futur Telegram/Discord peut
# viser un clip precis.
#
# Entrees REELLES (la porte ne bloque que la-dessus) :
#   - REVIEW/codex_render.json     signature validated_by_magos = true  (W1-R)
#   - REVIEW/codex_postprod.json   signature validated_by_magos = true  (PP1)
#   - REVIEW/pack_stage.json       le pack exporte (le seul pack, jamais re-derive)
#   - ARCHIVUM/campaign/watermarks/<le PNG dit par le pack>              (P3)
#
# Sorties ATTENDUES (constatees, jamais exigees en entree — ERRATA E-12) :
#   REVIEW/render/<clip>/... ,  REVIEW/render/render_report.json
#
# Etapes par clip (CLIs pillees, chemins repointes — EXC-M11) :
#   1. recuperer_clip.py            : la fenetre du clip depuis la VOD
#   2. convert_pur_pack.mjs --packs-out : le pack PUR mono-clip (matiere)
#   3. convert_pur_pack.mjs         : pur_manifest dev10.pur.v1 (codex render commande)
#   4. render_pictor.mjs            : LOOK Remotion (titre, logo, blur) — 1 clip
#   5. postprod.py                  : PP2 glow -> caption -> lut -> fade

on:
  workflow_dispatch:
    inputs:
      vod_url:
        description: 'URL de la VOD source'
        required: true
        default: 'https://www.twitch.tv/videos/2909800627'
        type: string
      nb_clips:
        description: 'Nombre de clips a rendre (defaut 9 = TOUT le pack)'
        required: false
        default: '9'
        type: string
      clip_ids:
        description: 'Clips precis (ex. A01,A02) — vide = tous selon nb_clips'
        required: false
        default: ''
        type: string

concurrency:
  group: murus-rendu-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  porte:
    runs-on: ubuntu-latest
    outputs:
      assets: ${{ steps.select.outputs.assets }}
      count: ${{ steps.select.outputs.count }}
      watermark: ${{ steps.select.outputs.watermark }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Porte — les DEUX codex signes, le pack, le PNG (entrees seulement)
        id: select
        env:
          NB: ${{ inputs.nb_clips }}
          IDS: ${{ inputs.clip_ids }}
        run: |
          python - << 'PYEOF'
          import json, os, sys
          from pathlib import Path

          refus = []
          codex = {}
          for nom in ("codex_render", "codex_postprod"):
              p = Path("REVIEW/%s.json" % nom)
              if not p.is_file():
                  refus.append("%s absent" % p)
                  continue
              codex[nom] = json.loads(p.read_text(encoding="utf-8"))
              if codex[nom].get("validated_by_magos") is not True:
                  refus.append("%s non signe par l'operateur (validated_by_magos != true)" % nom)

          pack_path = Path("REVIEW/pack_stage.json")
          if not pack_path.is_file():
              refus.append("REVIEW/pack_stage.json absent : rien a rendre")
          pack = json.loads(pack_path.read_text(encoding="utf-8")) if pack_path.is_file() else {"assets": []}

          if refus:
              for r in refus:
                  print("::error::PORTE FERMEE : " + r)
              print("aucun rendu ne demarre : c'est le comportement voulu")
              sys.exit(1)

          wm_file = (pack.get("watermark") or {}).get("file") or ""
          wm_path = Path("ARCHIVUM/campaign/watermarks") / wm_file if wm_file else None
          if wm_path and not wm_path.is_file():
              # le PNG du pack peut etre nomme production_pack_mark1_<token>.png : on retombe sur preme.png
              alt = Path("ARCHIVUM/campaign/watermarks/preme.png")
              if alt.is_file():
                  print("PNG du pack absent (%s), on utilise %s et on le renomme" % (wm_file, alt))
                  wm_path = alt
              else:
                  print("::error::PORTE FERMEE : PNG de campagne introuvable (%s)" % wm_file)
                  sys.exit(1)

          assets = pack.get("assets") or []
          ids = [x.strip() for x in (os.environ.get("IDS") or "").split(",") if x.strip()]
          want = [{"index": i,
                   "id": a.get("id") or ("clip%02d" % (i + 1)),
                   "start": float(a.get("start_sec") or 0),
                   "end": float(a.get("end_sec") or 0)}
                  for i, a in enumerate(assets)]
          if ids:
              want = [w for w in want if w["id"] in ids]
          else:
              want = want[: max(1, int(os.environ.get("NB") or 1))]

          if not want:
              print("::error::PORTE FERMEE : aucun clip selectionne")
              sys.exit(1)

          out = Path(os.environ["GITHUB_OUTPUT"])
          with out.open("a", encoding="utf-8") as f:
              f.write("assets=" + json.dumps(want) + "\n")
              f.write("count=%d\n" % len(want))
              f.write("watermark=%s\n" % wm_file)
          print("PORTE OUVERTE : %d clip(s) a rendre" % len(want))
          for w in want:
              print("  job rendu %s : %.1fs -> %.1fs" % (w["id"], w["start"], w["end"]))
          PYEOF

  clip:
    needs: porte
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        clip: ${{ fromJson(needs.porte.outputs.assets) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Installer ffmpeg + yt-dlp
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg
          python -m pip install --quiet --upgrade yt-dlp

      - name: 1. Recuperer la fenetre de ce clip
        env:
          IDX: ${{ matrix.clip.index }}
          INPUT_VOD: ${{ inputs.vod_url }}
        run: |
          mkdir -p /tmp/work/clips
          python FR_B_CREATION/tools/recuperer_clip.py \
            --pack REVIEW/pack_stage.json --index "$IDX" \
            --out-dir /tmp/work/clips --no-frame --vod "$INPUT_VOD"
          ls -la /tmp/work/clips

      - name: 2-3. Pack PUR mono-clip + manifeste (codex render commande)
        env:
          ID: ${{ matrix.clip.id }}
        run: |
          mkdir -p /tmp/work/packs /tmp/work/wm
          node FR_B_CREATION/tools/convert_pur_pack.mjs \
            --pack REVIEW/pack_stage.json \
            --out /tmp/work/pur_all.json \
            --codex-render REVIEW/codex_render.json \
            --packs-out /tmp/work/packs
          MONO=$(ls /tmp/work/packs/*_"${ID}".json | head -1)
          echo "pack mono-clip : $MONO"
          node FR_B_CREATION/tools/convert_pur_pack.mjs \
            --pack "$MONO" \
            --out /tmp/work/pur_manifest.json \
            --codex-render REVIEW/codex_render.json \
            --clip "/tmp/work/clips/pur_${ID}.mp4"
          # le PNG de campagne, sous le nom que le pack exige (P3)
          WM=$(python -c "import json;print((json.load(open('REVIEW/pack_stage.json',encoding='utf-8')).get('watermark') or {}).get('file',''))")
          SRC=$( [ -f "ARCHIVUM/campaign/watermarks/$WM" ] && echo "ARCHIVUM/campaign/watermarks/$WM" || echo "ARCHIVUM/campaign/watermarks/preme.png" )
          cp "$SRC" "/tmp/work/wm/$WM"
          ls -la /tmp/work/wm

      - name: Installer Remotion (outil de rendu pille)
        working-directory: FR_B_CREATION/SF_12_FABRICA/look/CODEBASE
        run: |
          npm install --no-audit --no-fund --loglevel=error

      - name: 4. LOOK — rendu Remotion de ce clip
        working-directory: FR_B_CREATION/SF_12_FABRICA/look/CODEBASE
        env:
          ID: ${{ matrix.clip.id }}
        run: |
          node render_pictor.mjs \
            --manifest /tmp/work/pur_manifest.json \
            --clips /tmp/work/clips \
            --watermarks /tmp/work/wm \
            --out /tmp/work/look \
            --entry 0
          ls -la /tmp/work/look

      - name: 5. PP2 — glow, sous-titres, lut, fade (ordre grave)
        env:
          ID: ${{ matrix.clip.id }}
        run: |
          IN=$(ls /tmp/work/look/*.mp4 | head -1)
          echo "entree postprod : $IN"
          python FR_B_CREATION/SF_13_POLITURA/CODEBASE/postprod.py \
            --input "$IN" \
            --output "/tmp/work/final/pur_${ID}.mp4" \
            --codex-postprod REVIEW/codex_postprod.json \
            --work /tmp/work/pp \
            --report "/tmp/work/final/postprod_${ID}.json"
          ls -la /tmp/work/final || true

      - name: 6. CAMOUFLAGE (SF_14) — reencodage H.264 yuv420p, faststart, loudnorm
        env:
          ID: ${{ matrix.clip.id }}
        run: |
          mkdir -p "/tmp/work/cam/${ID}" "/tmp/work/livre/${ID}"
          python FR_B_CREATION/SF_14_CAMOUFLAGE/CODEBASE/lac_f05_camouflage.py             --input "/tmp/work/final/pur_${ID}.mp4"             --output "/tmp/work/cam/${ID}"
          mv "/tmp/work/cam/${ID}/short_camouflaged.mp4" "/tmp/work/cam/${ID}/pur_${ID}_cam.mp4"
          ls -la "/tmp/work/cam/${ID}"

      - name: 7. LUTHER (SF_15) — metadonnees retirees, stream copy, livrable
        env:
          ID: ${{ matrix.clip.id }}
        run: |
          python FR_B_CREATION/SF_15_LUTHER/CODEBASE/lac_f06_luther.py             --input "/tmp/work/cam/${ID}/pur_${ID}_cam.mp4"             --output "/tmp/work/livre/${ID}"
          mv "/tmp/work/livre/${ID}/short_master.mp4" "/tmp/work/livre/${ID}/pur_${ID}_LIVRABLE.mp4"
          ls -la "/tmp/work/livre/${ID}"

      - name: Publier les etapes intermediaires (diagnostic)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rendu-${{ matrix.clip.id }}
          path: /tmp/work
          if-no-files-found: warn
          retention-days: 14

      - name: Publier LE LIVRABLE de ce clip (telechargeable seul)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: livrable-${{ matrix.clip.id }}
          path: /tmp/work/livre/${{ matrix.clip.id }}
          if-no-files-found: error
          retention-days: 30

  assemble:
    needs: [porte, clip]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Telecharger les clips rendus
        uses: actions/download-artifact@v4
        with:
          path: /tmp/all
          pattern: rendu-*
          merge-multiple: true

      - name: Rapport de rendu (on annonce ce qui est la, jamais de remplissage)
        run: |
          python - << 'PYEOF'
          import json
          from pathlib import Path

          finals = sorted(Path("/tmp/all/final").glob("*.mp4")) if Path("/tmp/all/final").exists() else []
          pack = json.loads(Path("REVIEW/pack_stage.json").read_text(encoding="utf-8"))
          demande = len(pack.get("assets") or [])
          rapport = {
              "rendus": [p.name for p in finals],
              "nb_rendus": len(finals),
              "nb_pack": demande,
              "note": "un clip sans fichier final = echec visible, jamais compense",
          }
          Path("REVIEW/render").mkdir(parents=True, exist_ok=True)
          Path("REVIEW/render/render_report.json").write_text(
              json.dumps(rapport, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")
          print(json.dumps(rapport, indent=2, ensure_ascii=False))
          if not finals:
              print("::error::aucun clip rendu : les deux codex sont signes, donc c'est le rendu qui echoue")
              raise SystemExit(1)
          PYEOF

      - name: Publier le pack rendu (artefact)
        uses: actions/upload-artifact@v4
        with:
          name: rendu-pack
          path: |
            /tmp/all/final
            REVIEW/render/render_report.json
          if-no-files-found: warn
          retention-days: 14

      - name: Rassembler les rapports CAMOUFLAGE et LUTHER des 9 clips
        run: |
          python - << 'PYEOF'
          import json
          from pathlib import Path

          def merge(demande, dossiers, mono, batch, out):
              videos, failed = [], []
              for rep in sorted(Path("/tmp/all").glob(dossiers)):
                  for f in sorted(rep.glob(mono)):
                      d = json.loads(f.read_text(encoding="utf-8"))
                      ok = bool(d.get("qa_pass"))
                      videos.append({"input": Path(d.get("input", "")).name,
                                     "output": Path(d.get("output", "")).name,
                                     "qa_pass": ok,
                                     "suspicious_tags_after": d.get("suspicious_tags_after") or []})
                      if not ok:
                          failed.append(Path(d.get("input", "")).name)
              Path(out).parent.mkdir(parents=True, exist_ok=True)
              Path(out).write_text(json.dumps({
                  "schema_version": "dev10-v2.%s.v1" % batch.replace("_batch_report.json", ""),
                  "mode": "batch_multi_videos",
                  "video_count": len(videos),
                  "processed": len(videos),
                  "failed": failed,
                  "all_qa_pass": len(failed) == 0 and len(videos) == demande,
                  "videos": videos,
              }, indent=2, ensure_ascii=False) + chr(10), encoding="utf-8")
              print("%s : %d video(s), all_qa_pass=%s" % (batch, len(videos), len(failed) == 0 and len(videos) == demande))

          pack = json.loads(Path("REVIEW/pack_stage.json").read_text(encoding="utf-8"))
          demande = len(pack.get("assets") or [])
          merge(demande, "cam/*", "camouflage_report.json", "camouflage_batch_report.json",
                "FR_B_CREATION/SF_14_CAMOUFLAGE/OUT/camouflage_batch_report.json")
          merge(demande, "livre/*", "luther_report.json", "luther_batch_report.json",
                "FR_B_CREATION/SF_15_LUTHER/OUT/luther_batch_report.json")
          # OUT/ est gitignore (E-15) : la preuve doit vivre a un endroit commitable
          import shutil
          Path("REVIEW/render").mkdir(parents=True, exist_ok=True)
          for src in ("FR_B_CREATION/SF_14_CAMOUFLAGE/OUT/camouflage_batch_report.json",
                      "FR_B_CREATION/SF_15_LUTHER/OUT/luther_batch_report.json"):
              shutil.copyfile(src, Path("REVIEW/render") / Path(src).name)
              print("preuve copiee ->", Path("REVIEW/render") / Path(src).name)
          PYEOF

      - name: PORTE V7 — aucun livrable sale ne sort
        run: |
          python - << 'PYEOF'
          import sys
          from pathlib import Path
          sys.path.insert(0, str(Path("FR_B_CREATION").resolve()))
          from GATES.gates_b import gate_v7_refuses_sale_livrable
          ok, motif = gate_v7_refuses_sale_livrable()
          print("PORTE V7 :", ok, "|", motif)
          if not ok:
              print("::error::V7 REFUSE : " + motif)
              raise SystemExit(1)
          PYEOF

      - name: Rapport final + commit (la trace existe sur GitHub, pas seulement en artefact)
        run: |
          python - << 'PYEOF'
          import json
          from pathlib import Path

          livres = sorted(Path("/tmp/all").glob("livre/*/pur_*_LIVRABLE.mp4"))
          pack = json.loads(Path("REVIEW/pack_stage.json").read_text(encoding="utf-8"))
          rapport = {
              "pack_token": pack.get("pack_token"),
              "nb_demande": len(pack.get("assets") or []),
              "nb_livrable": len(livres),
              "livrables": [{"clip": p.name.split("_")[1], "octets": p.stat().st_size} for p in livres],
              "etages": ["postprod", "camouflage", "luther"],
              "note": "un clip absent est annonce absent, jamais compense",
          }
          Path("REVIEW/render").mkdir(parents=True, exist_ok=True)
          Path("REVIEW/render/render_report.json").write_text(
              json.dumps(rapport, indent=2, ensure_ascii=False) + chr(10), encoding="utf-8")
          print(json.dumps(rapport, indent=2, ensure_ascii=False))
          if len(livres) != rapport["nb_demande"]:
              print("::error::livrables incomplets : %d/%d" % (len(livres), rapport["nb_demande"]))
              raise SystemExit(1)
          PYEOF
      # Le commit du rapport ne doit JAMAIS bloquer la livraison (ERRATA E-14) :
      # il arrive apres un autre push (CI ou operateur) et le push est rejete.
      - name: Commiter le rapport (resilient, jamais bloquant)
        continue-on-error: true
        run: |
          git config user.name "murus-bot"
          git config user.email "murus-bot@users.noreply.github.com"
          git add -f REVIEW/render/render_report.json             REVIEW/render/camouflage_batch_report.json             REVIEW/render/luther_batch_report.json || {
            echo "::error::preuves de rendu absentes — impossible de tracer le run"; exit 1; }
          if git diff --cached --quiet; then
            echo "rapport inchange"
            exit 0
          fi
          git commit -m "[CI] rapport de rendu + preuves qa_pass (camouflage, luther)"
          for i in 1 2 3 4; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME:-main}" && git push && exit 0
            echo "push rejete, nouvelle tentative $i"
            sleep 5
          done
          echo "::warning::rapport non pousse (course git) — la livraison continue"
          exit 0

      - name: Publier LE ZIP DES 9 LIVRABLES (un seul telechargement)
        uses: actions/upload-artifact@v4
        with:
          name: preme-pack-9-livrables
          path: |
            /tmp/all/livre/*/pur_*_LIVRABLE.mp4
            REVIEW/render/render_report.json
          if-no-files-found: error
          retention-days: 30
